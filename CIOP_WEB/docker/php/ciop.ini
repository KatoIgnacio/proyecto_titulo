; =============================================================
;  Ajustes de PHP para CIOP Central
; =============================================================

; Sin esto, las fechas de modificación de los archivos se
; muestran en UTC y quedan corridas respecto de la hora local.
date.timezone = America/Santiago

; Los avisos no deben imprimirse: data.php devuelve JSON y
; cualquier texto previo rompe la respuesta en el navegador.
; Quedan en el log del contenedor (docker compose logs -f).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; El KML se entrega con readfile, así que no carga en memoria,
; pero el parseo de los TXT sí necesita holgura.
memory_limit = 512M
max_execution_time = 120

; No se suben archivos por ahora; se deja preparado para
; cuando exista la pantalla de carga (RF01).
upload_max_filesize = 64M
post_max_size = 64M

; Codificación de trabajo. parse.php convierte desde
; Windows-1252 e ISO-8859-1 hacia UTF-8.
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8
