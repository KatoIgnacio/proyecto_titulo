# =============================================================
#  VirtualHost de CIOP Central
#  La raíz web es public/. La carpeta src/ queda fuera y además
#  se bloquea explícitamente, para que config.php nunca sea
#  accesible desde el navegador.
# =============================================================
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Doble protección de la capa de lógica y configuración
    <Directory /var/www/html/src>
        Require all denied
    </Directory>

    # --- Compresión -------------------------------------------------------
    # El KML de la red pesa unos 116 MB sin comprimir. Es XML, así que
    # baja muchísimo y la vista Mapa carga bastante más rápido.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE \
            text/plain \
            text/html \
            text/xml \
            text/css \
            text/javascript \
            application/javascript \
            application/json \
            application/xml \
            application/vnd.google-earth.kml+xml
        DeflateCompressionLevel 6
    </IfModule>

    # --- Caché de estáticos ----------------------------------------------
    # No afecta a la API: data.php envía sus propias cabeceras no-store.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                "access plus 1 hour"
        ExpiresByType application/javascript  "access plus 1 hour"
        ExpiresByType image/png               "access plus 7 days"
        ExpiresByType image/jpeg              "access plus 7 days"
        ExpiresByType image/svg+xml           "access plus 7 days"
    </IfModule>

    ErrorLog  /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
