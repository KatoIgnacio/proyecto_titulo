name: luzparral-integration

services:
  db:
    image: mysql:8.4.9
    restart: "no"
    environment:
      MYSQL_DATABASE: luzparral
      MYSQL_USER: luzparral_app
      MYSQL_PASSWORD: ${LUZPARRAL_INTEGRATION_DB_PASSWORD:?Defina la clave temporal de MySQL}
      MYSQL_ROOT_PASSWORD: ${LUZPARRAL_INTEGRATION_ROOT_PASSWORD:?Defina la clave temporal de root}
      TZ: America/Santiago
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    volumes:
      - integration-db-data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: luzparral-app:integration
    restart: "no"
    environment:
      APP_NAME: Luzparral Contingencias
      APP_ENV: production
      APP_KEY: ${LUZPARRAL_INTEGRATION_APP_KEY:?Defina la clave temporal de Laravel}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_TIMEZONE: America/Santiago
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_CL
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: luzparral
      DB_USERNAME: luzparral_app
      DB_PASSWORD: ${LUZPARRAL_INTEGRATION_DB_PASSWORD:?Defina la clave temporal de MySQL}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 60
      SESSION_EXPIRE_ON_CLOSE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_PATH: /
      SESSION_DOMAIN: "null"
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      PASSWORD_RESET_ENABLED: "false"
      SECURITY_HEADERS_ENABLED: "true"
      SECURITY_MAX_ACTIVE_USERS: 10
      AUTH_PASSWORD_TIMEOUT: 900
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: sistema@luzparral.example.invalid
      MAIL_FROM_NAME: Luzparral Contingencias
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080

volumes:
  integration-db-data:
